<!DOCTYPE html>
<html>
<head>
  <title>Pobreza por grupos</title>
  <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
  <script type="text/javascript">
    google.charts.load('current', {'packages':['corechart']});
    google.charts.setOnLoadCallback(drawChart);

    function drawChart() {
      var data = google.visualization.arrayToDataTable([
        ['Grupo de población', '2008 (%)', '2018 (%)'],
        ['Población indígena', 76.0, 74.9],
        ['Población no indígena', 41.4, 39.4],
        ['Mujeres', 44.6, 42.4],
        ['Hombres', 44.0, 41.4],
        ['Menores de 18 años', 53.3, 49.6],
        ['Adultos mayores (65 o más años)', 44.9, 41.1]
      ]);

      var options = {
        title: 'Porcentaje de pobreza por grupos de población (2008-2018)',
        chartArea: {width: '60%'}, // Ajusta el ancho del área del gráfico
        hAxis: {
          title: 'Porcentaje de pobreza',
          minValue: 0
        },
        vAxis: {
          title: 'Grupo de población'
        },
        isStacked: false // Para mostrar las barras agrupadas
      };

      var chart = new google.visualization.BarChart(document.getElementById('chart_div'));

      chart.draw(data, options);
    }
  </script>
</head>
<body>
  <h1>Pobreza por grupos</h1>
  <div id="chart_div" style="width: 900px; height: 500px;"></div>
</body>
</html>
